proxy_cache_path /var/cache/nginx/ne_ceo levels=1:2 keys_zone=ne_ceo:16m max_size=128m inactive=15m use_temp_path=off;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Kissflow opens this page in a frame. Do not send X-Frame-Options.
  add_header Content-Security-Policy "frame-ancestors *" always;

  # KPI landing only (not /records inventory) — short edge cache for mobile Kissflow.
  location ~ ^/api/v1/dashboard/application/[^/]+/?$ {
    proxy_pass https://refex-backend-api-dhwffeu7pq-el.a.run.app;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host refex-backend-api-dhwffeu7pq-el.a.run.app;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 30s;
    proxy_read_timeout 120s;
    proxy_cache ne_ceo;
    proxy_cache_key "$request_uri";
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 90s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    add_header X-Cache-Status $upstream_cache_status always;
    add_header Content-Security-Policy "frame-ancestors *" always;
  }

  location /api/v1/ {
    proxy_pass https://refex-backend-api-dhwffeu7pq-el.a.run.app/api/v1/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host refex-backend-api-dhwffeu7pq-el.a.run.app;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 30s;
    proxy_read_timeout 120s;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800, immutable";
    add_header Content-Security-Policy "frame-ancestors *" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "frame-ancestors *" always;
  }
}
